# /etc/nginx/sites-available/tvnetlago
server {
    listen 80;
    server_name _;            # o tu dominio: panel.tvnetlago.com

    client_max_body_size 10M;

    # Archivos estáticos (css, jquery, select2...) los entrega Nginx directo
    location /static/ {
        alias /srv/tvnetlago/staticfiles/;
        expires 7d;
    }

    # Todo lo demás va a Django (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
