# /etc/nginx/sites-available/phpmyadmin
# phpMyAdmin SOLO para la red interna, en el puerto 8081.
# Nunca abras este puerto hacia internet (en el router NO hagas port-forward del 8081).
server {
    listen 8081;
    server_name _;

    # ---- Quién puede entrar: cambia por TU red interna ----
    allow 192.168.3.0/24;     # red de la oficina
    allow 127.0.0.1;          # para usarlo por túnel SSH
    deny  all;

    root /usr/share/phpmyadmin;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Si da error 502, mira el nombre real con:  ls /run/php/
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Carpetas internas de phpMyAdmin que no deben verse
    location ~ ^/(libraries|setup|templates|locale|sql)/ {
        deny all;
    }
}
