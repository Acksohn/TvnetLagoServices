{% if campo.field.widget.input_type == "checkbox" %}
<div class="campo campo-check {% if campo.errors %}con-error{% endif %}">
  <label>{{ campo }} {{ campo.label }}</label>
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
</div>
{% else %}
<div class="campo {% if campo.errors %}con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
{% endif %}
